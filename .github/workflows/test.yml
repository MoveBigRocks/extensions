name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate First-Party Extensions
    runs-on: ubuntu-latest
    env:
      PLATFORM_REF: main
    services:
      # Match production (PostgreSQL 18). The extension DB-backed tests skip when
      # no admin database is reachable, so without this they never run in CI.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout extension sources
        uses: actions/checkout@v6

      - name: Checkout platform sources for CLI validation
        uses: actions/checkout@v6
        with:
          repository: MoveBigRocks/platform
          ref: ${{ env.PLATFORM_REF }}
          path: platform

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            go.mod
            platform/go.mod
            platform/go.sum

      - name: Set up Go workspace
        run: |
          rm -f go.work go.work.sum
          go work init .
          go work use ./platform

      - name: Check public extension boundary
        run: bash ./scripts/check-public-boundary.sh

      - name: Run extension Go tests
        env:
          TEST_DATABASE_ADMIN_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
          install-mode: goinstall

      - name: Security scan with gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -severity=high -confidence=high -exclude=G703,G704 -fmt text ./...

      - name: Vulnerability scan with govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Build every runtime entrypoint
        run: go build ./cmd/...

      - name: Build mbr CLI
        working-directory: platform
        run: go build -o "${RUNNER_TEMP}/mbr" ./cmd/mbr

      - name: Validate first-party extension contracts
        env:
          MBR_BIN: ${{ runner.temp }}/mbr
        run: bash ./scripts/validate-first-party.sh
